# Build + test only. Does not build or publish container images.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PodcastToYoto.slnx
      - run: dotnet build PodcastToYoto.slnx --no-restore -c Release
      - run: dotnet test PodcastToYoto.slnx --no-build -c Release --verbosity normal
